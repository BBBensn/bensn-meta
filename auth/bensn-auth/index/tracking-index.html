<!doctype html>
<html lang="de">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Tracking · bensn.me</title>
        <meta
            name="description"
            content="Habit Tracking — Konsum, Verbrauch, Gewohnheiten."
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta
            name="apple-mobile-web-app-status-bar-style"
            content="black-translucent"
        />
        <meta name="apple-mobile-web-app-title" content="Tracking" />
        <meta name="theme-color" content="#0a0a0b" />
        <link rel="manifest" href="/manifest.json" />
        <link rel="apple-touch-icon" href="/icons/icon-192.png" />
        <link
            rel="icon"
            type="image/png"
            sizes="192x192"
            href="/icons/icon-192.png"
        />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
            href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Syne:wght@400;500;700;800&display=swap"
            rel="stylesheet"
        />
        <link rel="stylesheet" href="/shared/bensn.css" />
        <style>
            body {
                overscroll-behavior: none;
            }

            .app-wrap {
                position: relative;
                z-index: 1;
                max-width: 800px;
                margin: 0 auto;
                padding: 0 1.25rem 4rem;
                min-height: 100vh;
                display: flex;
                flex-direction: column;
            }

            /* ── Tabs ── */
            .tabs {
                display: flex;
                border-bottom: 1px solid var(--border);
                margin-bottom: 1.25rem;
            }
            .tab {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                padding: 9px 14px;
                cursor: pointer;
                color: var(--muted);
                border: none;
                border-bottom: 2px solid transparent;
                margin-bottom: -1px;
                background: none;
                transition:
                    color 0.15s,
                    border-color 0.15s;
            }
            .tab.active {
                color: var(--text);
                border-bottom-color: var(--text);
            }
            .tab:hover:not(.active) {
                color: var(--text);
            }
            .tab-section {
                display: none;
            }
            .tab-section.visible {
                display: block;
            }

            /* ── API Status Bar ── */
            .api-bar {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                padding: 0.6rem 1rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 1rem;
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
            }
            .api-bar .dot-sm {
                width: 5px;
                height: 5px;
                border-radius: 50%;
                flex-shrink: 0;
                background: var(--muted);
            }
            .api-bar .dot-sm.ok {
                background: var(--green);
                animation: pulse 2s ease-in-out infinite;
            }
            .api-bar .dot-sm.err {
                background: var(--accent-red);
            }
            .api-bar-right {
                margin-left: auto;
                color: rgba(255, 255, 255, 0.2);
                cursor: pointer;
                transition: color 0.15s;
            }
            .api-bar-right:hover {
                color: var(--muted);
            }

            /* ── Category Group ── */
            .cat-group {
                margin-bottom: 1.5rem;
            }
            .cat-header {
                display: flex;
                align-items: center;
                gap: 0.6rem;
                margin-bottom: 0.75rem;
            }
            .cat-icon {
                font-size: 14px;
                line-height: 1;
            }
            .cat-title {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .cat-today-total {
                margin-left: auto;
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
            }

            /* ── Item Card ── */
            .item-card {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                padding: 1rem 1.25rem;
                margin-bottom: 6px;
                display: grid;
                grid-template-columns: 1fr auto;
                gap: 0.75rem;
                align-items: center;
                transition: border-color 0.15s;
            }
            .item-card:hover {
                border-color: var(--border-hover);
            }
            .item-name {
                font-family: "Syne", sans-serif;
                font-size: 0.95rem;
                font-weight: 700;
                letter-spacing: -0.01em;
                margin-bottom: 2px;
            }
            .item-meta {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
            }

            /* Bestand display */
            .item-bestand {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                margin-top: 5px;
                display: flex;
                align-items: center;
                gap: 0.5rem;
                flex-wrap: wrap;
            }
            .bestand-val {
                color: var(--text);
                font-weight: 500;
            }
            .bestand-label {
                color: var(--muted);
            }
            .bestand-verbrauch {
                color: var(--muted);
                font-size: 10px;
            }
            .bestand-verbrauch.warn {
                color: var(--orange);
            }
            .bestand-verbrauch.low {
                color: var(--accent-red);
            }

            /* Zähler display */
            .item-zaehler {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                margin-top: 5px;
                color: var(--muted);
            }
            .item-zaehler span {
                color: var(--text);
                font-weight: 500;
            }

            .item-actions {
                display: flex;
                align-items: center;
                gap: 0.4rem;
                flex-shrink: 0;
            }
            .btn-unit {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.04em;
                background: none;
                border: 1px solid var(--border-hover);
                color: var(--text);
                border-radius: 8px;
                padding: 7px 13px;
                cursor: pointer;
                transition:
                    background 0.15s,
                    border-color 0.15s,
                    color 0.15s;
                white-space: nowrap;
            }
            .btn-unit:hover {
                background: rgba(255, 255, 255, 0.06);
                border-color: rgba(255, 255, 255, 0.3);
            }
            .btn-unit:active {
                background: rgba(255, 255, 255, 0.1);
                transform: scale(0.96);
            }

            .btn-icon {
                width: 30px;
                height: 30px;
                background: none;
                border: 1px solid var(--border);
                border-radius: 7px;
                color: var(--muted);
                cursor: pointer;
                font-size: 14px;
                display: flex;
                align-items: center;
                justify-content: center;
                transition:
                    border-color 0.15s,
                    color 0.15s;
                flex-shrink: 0;
                padding: 0;
            }
            .btn-icon:hover {
                border-color: var(--border-hover);
                color: var(--text);
            }

            /* Category color accents */
            .cat-kiffen .item-card {
                border-left: 2px solid rgba(74, 222, 128, 0.25);
            }
            .cat-kiffen .btn-unit {
                border-color: rgba(74, 222, 128, 0.4);
                color: var(--green);
            }
            .cat-kiffen .btn-unit:hover {
                background: rgba(74, 222, 128, 0.08);
                border-color: rgba(74, 222, 128, 0.7);
            }
            .cat-rauchen .item-card {
                border-left: 2px solid rgba(232, 114, 74, 0.25);
            }
            .cat-rauchen .btn-unit {
                border-color: rgba(232, 114, 74, 0.4);
                color: var(--orange);
            }
            .cat-rauchen .btn-unit:hover {
                background: rgba(232, 114, 74, 0.08);
                border-color: rgba(232, 114, 74, 0.7);
            }
            .cat-lebensmittel .item-card {
                border-left: 2px solid rgba(0, 166, 251, 0.25);
            }
            .cat-lebensmittel .btn-unit {
                border-color: rgba(0, 166, 251, 0.4);
                color: var(--accent-blue);
            }
            .cat-lebensmittel .btn-unit:hover {
                background: rgba(0, 166, 251, 0.08);
                border-color: rgba(0, 166, 251, 0.7);
            }

            /* ── Verlauf ── */
            .history-day {
                margin-bottom: 1.5rem;
            }
            .history-day-header {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
                padding-bottom: 0.5rem;
                border-bottom: 1px solid var(--border);
                margin-bottom: 0.75rem;
            }
            .history-entry {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.6rem 0.9rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 8px;
                margin-bottom: 4px;
                transition: border-color 0.15s;
            }
            .history-entry:hover {
                border-color: var(--border-hover);
            }
            .history-time {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                width: 42px;
                flex-shrink: 0;
            }
            .history-name {
                font-family: "Syne", sans-serif;
                font-size: 0.85rem;
                font-weight: 600;
                flex: 1;
                min-width: 0;
            }
            .history-type-badge {
                font-family: "DM Mono", monospace;
                font-size: 9px;
                padding: 1px 6px;
                border-radius: 3px;
                flex-shrink: 0;
            }
            .history-type-badge.bestand {
                background: rgba(255, 180, 0, 0.1);
                border: 1px solid rgba(255, 180, 0, 0.25);
                color: #ffb400;
            }
            .history-type-badge.zaehler {
                background: rgba(0, 166, 251, 0.08);
                border: 1px solid rgba(0, 166, 251, 0.2);
                color: var(--accent-blue);
            }
            .history-amount {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                color: var(--muted);
                white-space: nowrap;
            }
            .history-amount span {
                color: var(--text);
                font-weight: 500;
            }
            .history-delete {
                width: 24px;
                height: 24px;
                background: none;
                border: none;
                color: rgba(255, 0, 81, 0.3);
                cursor: pointer;
                font-size: 14px;
                padding: 0;
                display: flex;
                align-items: center;
                justify-content: center;
                border-radius: 5px;
                transition:
                    color 0.15s,
                    background 0.15s;
                flex-shrink: 0;
            }
            .history-delete:hover {
                color: var(--accent-red);
                background: rgba(255, 0, 81, 0.08);
            }
            .history-day-totals {
                margin-top: 0.5rem;
                display: flex;
                flex-wrap: wrap;
                gap: 0.35rem;
            }
            .history-total-badge {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                padding: 2px 8px;
                border-radius: 4px;
                border: 1px solid var(--border);
                color: var(--muted);
            }

            /* ── Bottom Sheet (shared) ── */
            .overlay {
                position: fixed;
                inset: 0;
                background: rgba(0, 0, 0, 0.75);
                z-index: 100;
                display: flex;
                align-items: flex-end;
                justify-content: center;
            }
            .overlay-sheet {
                background: #161616;
                border: 1px solid rgba(255, 255, 255, 0.12);
                border-radius: 16px 16px 0 0;
                padding: 1.5rem 1.25rem 2.5rem;
                width: 100%;
                max-width: 480px;
            }
            .sheet-label {
                font-family: "DM Mono", monospace;
                font-size: 9px;
                letter-spacing: 0.1em;
                text-transform: uppercase;
                color: var(--muted);
                margin-bottom: 4px;
            }
            .sheet-title {
                font-family: "Syne", sans-serif;
                font-size: 1.3rem;
                font-weight: 800;
                margin-bottom: 1.25rem;
                letter-spacing: -0.02em;
            }
            .sheet-subtitle {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                margin-bottom: 1rem;
                line-height: 1.6;
            }

            /* Toggle for Bestand vs Zähler */
            .mode-toggle {
                display: flex;
                gap: 0.4rem;
                margin-bottom: 1rem;
            }
            .mode-btn {
                flex: 1;
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 8px;
                border-radius: 8px;
                border: 1px solid var(--border);
                background: none;
                color: var(--muted);
                cursor: pointer;
                transition: all 0.15s;
                text-align: center;
            }
            .mode-btn.active {
                border-color: var(--accent-blue);
                color: var(--accent-blue);
                background: rgba(0, 166, 251, 0.08);
            }

            .input-row {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 0.5rem 0.75rem;
                margin-bottom: 0.75rem;
            }
            .input-row input {
                flex: 1;
                background: none;
                border: none;
                color: var(--text);
                font-family: "DM Mono", monospace;
                font-size: 1.4rem;
                font-weight: 500;
                outline: none;
                min-width: 0;
            }
            .input-row input::placeholder {
                color: rgba(255, 255, 255, 0.15);
            }
            .input-unit {
                font-family: "DM Mono", monospace;
                font-size: 13px;
                color: var(--muted);
                flex-shrink: 0;
            }
            .presets {
                display: flex;
                flex-wrap: wrap;
                gap: 0.4rem;
                margin-bottom: 0.75rem;
            }
            .preset-btn {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                padding: 5px 12px;
                border-radius: 6px;
                border: 1px solid var(--border);
                color: var(--muted);
                background: none;
                cursor: pointer;
                transition: all 0.15s;
            }
            .preset-btn:hover {
                border-color: var(--border-hover);
                color: var(--text);
                background: rgba(255, 255, 255, 0.04);
            }
            .note-input {
                width: 100%;
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 10px;
                padding: 8px 12px;
                color: var(--text);
                font-family: "DM Mono", monospace;
                font-size: 12px;
                outline: none;
                margin-bottom: 1rem;
            }
            .note-input::placeholder {
                color: var(--muted);
            }
            .sheet-btns {
                display: flex;
                gap: 0.5rem;
            }
            .btn-save {
                flex: 1;
                font-family: "DM Mono", monospace;
                font-size: 11px;
                font-weight: 500;
                letter-spacing: 0.06em;
                background: var(--green);
                color: #0a0a0b;
                border: none;
                border-radius: 8px;
                padding: 11px;
                cursor: pointer;
            }
            .btn-cancel {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                background: none;
                border: 1px solid var(--border);
                color: var(--muted);
                border-radius: 8px;
                padding: 11px 18px;
                cursor: pointer;
            }

            /* ── Toast ── */
            .toast {
                position: fixed;
                bottom: 2rem;
                left: 50%;
                transform: translateX(-50%) translateY(20px);
                background: #1e1e20;
                border: 1px solid var(--border-hover);
                border-radius: 8px;
                padding: 9px 18px;
                font-family: "DM Mono", monospace;
                font-size: 12px;
                color: var(--text);
                z-index: 200;
                opacity: 0;
                transition:
                    opacity 0.2s,
                    transform 0.2s;
                pointer-events: none;
                white-space: nowrap;
            }
            .toast.show {
                opacity: 1;
                transform: translateX(-50%) translateY(0);
            }

            /* ── Footer ── */
            .app-footer {
                border-top: 1px solid var(--border);
                padding: 1rem 0;
                display: flex;
                justify-content: space-between;
                margin-top: auto;
            }
            .app-footer span {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                color: var(--muted);
            }
            .empty-state {
                font-family: "DM Mono", monospace;
                font-size: 12px;
                color: var(--muted);
                text-align: center;
                padding: 2.5rem 1rem;
                border: 1px dashed var(--border);
                border-radius: 16px;
                line-height: 1.8;
            }

            /* ── Worktracker supplement row ── */
            .item-wt-row {
                display: flex;
                align-items: center;
                gap: 0.5rem;
                margin-top: 5px;
                flex-wrap: wrap;
            }
            .wt-arbeit-badge {
                font-family: "DM Mono", monospace;
                font-size: 9px;
                letter-spacing: 0.08em;
                text-transform: uppercase;
                padding: 1px 6px;
                border-radius: 3px;
                background: rgba(0, 166, 237, 0.1);
                border: 1px solid rgba(0, 166, 237, 0.25);
                color: var(--accent-blue);
                flex-shrink: 0;
            }
            .wt-arbeit-val {
                font-family: "DM Mono", monospace;
                font-size: 11px;
                color: var(--text);
                font-weight: 500;
            }
            .wt-arbeit-src {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
            }

            /* ── Day header (Location-Style) ── */
            .day-header {
                display: flex;
                align-items: center;
                gap: 10px;
                margin: 1.25rem 0 0.6rem;
                padding: 0 2px;
            }
            .day-header:first-child {
                margin-top: 0;
            }
            .day-label {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.12em;
                text-transform: uppercase;
                color: var(--muted);
                white-space: nowrap;
            }
            .day-count {
                font-family: "DM Mono", monospace;
                font-size: 9px;
                color: rgba(255, 255, 255, 0.2);
                white-space: nowrap;
            }
            .day-line {
                flex: 1;
                height: 1px;
                background: var(--border);
            }

            /* ── Date filter pills ── */
            .date-filter {
                display: flex;
                gap: 6px;
                overflow-x: auto;
                padding-bottom: 4px;
                margin-bottom: 1rem;
                scrollbar-width: none;
            }
            .date-filter::-webkit-scrollbar {
                display: none;
            }
            .date-filter-btn {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.06em;
                padding: 5px 12px;
                border-radius: 6px;
                border: 1px solid var(--border);
                color: var(--muted);
                background: none;
                cursor: pointer;
                white-space: nowrap;
                transition: all 0.15s;
                flex-shrink: 0;
            }
            .date-filter-btn.active {
                border-color: var(--accent-blue);
                color: var(--accent-blue);
                background: rgba(0, 166, 251, 0.08);
            }
            .date-filter-btn:hover:not(.active) {
                border-color: var(--border-hover);
                color: var(--text);
            }

            /* ── Einstellungen ── */
            .settings-section {
                margin-bottom: 2rem;
            }
            .settings-section-header {
                display: flex;
                align-items: center;
                justify-content: space-between;
                margin-bottom: 0.75rem;
            }
            .settings-section-title {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.14em;
                text-transform: uppercase;
                color: var(--muted);
            }
            .btn-add {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                letter-spacing: 0.06em;
                padding: 4px 10px;
                border-radius: 6px;
                border: 1px solid rgba(74, 222, 128, 0.3);
                color: var(--green);
                background: none;
                cursor: pointer;
                transition: all 0.15s;
            }
            .btn-add:hover {
                background: rgba(74, 222, 128, 0.08);
                border-color: rgba(74, 222, 128, 0.6);
            }

            .settings-cat {
                background: var(--surface);
                border: 1px solid var(--border);
                border-radius: 12px;
                margin-bottom: 8px;
                overflow: hidden;
            }
            .settings-cat-header {
                display: flex;
                align-items: center;
                gap: 0.75rem;
                padding: 0.9rem 1.1rem;
                cursor: pointer;
                transition: background 0.15s;
            }
            .settings-cat-header:hover {
                background: rgba(255, 255, 255, 0.02);
            }
            .settings-cat-emoji {
                font-size: 16px;
                line-height: 1;
                flex-shrink: 0;
            }
            .settings-cat-name {
                font-family: "Syne", sans-serif;
                font-size: 0.95rem;
                font-weight: 700;
                flex: 1;
            }
            .settings-cat-count {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
            }
            .settings-cat-chevron {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                transition: transform 0.2s;
            }
            .settings-cat-chevron.open {
                transform: rotate(180deg);
            }
            .settings-cat-body {
                border-top: 1px solid var(--border);
                display: none;
            }
            .settings-cat-body.open {
                display: block;
            }
            .settings-cat-actions {
                display: flex;
                gap: 0.5rem;
                padding: 0.75rem 1.1rem;
                border-bottom: 1px solid var(--border);
            }

            .settings-item-row {
                display: grid;
                grid-template-columns: 1fr auto auto;
                align-items: center;
                gap: 0.75rem;
                padding: 0.7rem 1.1rem;
                border-bottom: 1px solid rgba(255, 255, 255, 0.04);
                transition: background 0.15s;
            }
            .settings-item-row:last-child {
                border-bottom: none;
            }
            .settings-item-row:hover {
                background: rgba(255, 255, 255, 0.02);
            }
            .settings-item-name {
                font-family: "DM Mono", monospace;
                font-size: 12px;
                color: var(--text);
            }
            .settings-item-meta {
                font-family: "DM Mono", monospace;
                font-size: 10px;
                color: var(--muted);
                margin-top: 2px;
            }
            .settings-item-mode {
                font-family: "DM Mono", monospace;
                font-size: 9px;
                padding: 2px 6px;
                border-radius: 3px;
                flex-shrink: 0;
            }

        <!-- Toast -->

        <script src="/shared/bensn.js"></script>
        <script>
            /* ════════════════════════════════════════════════════════════════
   API
   ════════════════════════════════════════════════════════════════ */
            const API_BASE = "";
            function apiHeaders() {
                return {
                    "Content-Type": "application/json",
                    // X-API-Key wird von Nginx injiziert — kein Key im Frontend nötig
                };
            }
            async function apiFetch(path, method = "GET", body = null) {
                const opts = { method, headers: apiHeaders() };
                if (body) opts.body = JSON.stringify(body);
                const r = await fetch(API_BASE + path, opts);
                if (!r.ok) throw new Error(r.status + " " + r.statusText);
                return r.json();
            }

            /* ════════════════════════════════════════════════════════════════
   STATE
   ════════════════════════════════════════════════════════════════ */
            let _categories = []; // [{id, name, emoji, color, items:[...]}]
            let _allEntries = [];
            let _wtByDate = {};
            let _activeDay = null;
            let _overlayItem = null;
            let _apiOnline = false;

            /* ════════════════════════════════════════════════════════════════
   HELPERS
   ════════════════════════════════════════════════════════════════ */
            function pad(n) {
                return String(n).padStart(2, "0");
            }

            function todayKey() {
                return new Date().toLocaleDateString("en-CA", {
                    timeZone: "Europe/Vienna",
                });
            }

            function fmtAmt(amount, item) {
                const n = parseFloat(amount) || 0;
                if (!item) return n;
                const unit = item.base_unit || "";
                // Whole-number units
                const wholeUnits = [
                    "Stk.",
                    "Dose",
                    "Dosen",
                    "Packung",
                    "Flasche",
                    "Flaschen",
                    "Stück",
                ];
                const isWhole = wholeUnits.some(
                    (u) => unit.includes(u.replace(".", "")) || unit === u,
                );
                if (item.slug === "redbull")
                    return n === 1 ? "1 Dose" : `${n} Dosen`;
                if (unit === "g") {
                    if (n >= 1000) {
                        const kg = n / 1000;
                        return `${+kg.toFixed(2).replace(/\.?0+$/, "")} kg`;
                    }
                    return `${+n.toFixed(1).replace(/\.?0+$/, "")} g`;
                }
                if (unit === "ml")
                    return `${+n.toFixed(1).replace(/\.?0+$/, "")} ml`;
                if (isWhole) return `${Math.round(n)} ${unit}`;
                // Default: up to 2 decimal places, trim trailing zeros
                return `${+n.toFixed(2).replace(/\.?0+$/, "")} ${unit}`;
            }

            function localTimeStr(isoStr) {
                if (!isoStr) return "—";
                return new Date(isoStr).toLocaleTimeString("de-AT", {
                    timeZone: "Europe/Vienna",
                    hour: "2-digit",
                    minute: "2-digit",
                });
            }
            function localDateStr(isoStr) {
                if (!isoStr) return "—";
                return new Date(isoStr).toLocaleDateString("de-AT", {
                    timeZone: "Europe/Vienna",
                    day: "2-digit",
                    month: "2-digit",
                });
            }

            function allItems() {
                return _categories.flatMap((c) =>
                    (c.items || []).map((i) => ({
                        ...i,
                        category: c.name,
                        cat_emoji: c.emoji,
                        cat_color: c.color,
                    })),
                );
            }

            function itemBySlug(slug) {
                return allItems().find((i) => i.slug === slug);
            }
            function itemById(id) {
                return allItems().find((i) => i.id === id);
            }

            function entriesForItem(itemId) {
                return _allEntries.filter((e) => e.item_id === itemId);
            }

            // ── Zähler helpers ──
            function zaehlerToday(itemId) {
                const td = todayKey();
                return _allEntries
                    .filter(
                        (e) =>
                            e.item_id === itemId &&
                            e.date === td &&
                            e.entry_type === "zaehler",
                    )
                    .reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
            }

            // ── Vorrat helpers ──
            // Alle Buchungen kumulativ: auffuellung=+, entnahme=-, delta=signed
            function vorratBestand(itemId) {
                const rows = entriesForItem(itemId)
                    .filter((e) =>
                        ["auffuellung", "entnahme", "delta"].includes(
                            e.entry_type,
                        ),
                    )
                    .sort((a, b) => a.timestamp.localeCompare(b.timestamp));
                if (!rows.length) return null;
                let bestand = 0;
                rows.forEach((e) => {
                    const amt = parseFloat(e.amount) || 0;
                    if (e.entry_type === "auffuellung") bestand += amt;
                    else if (e.entry_type === "entnahme") bestand -= amt;
                    else if (e.entry_type === "delta") bestand += amt;
                });
                // Option C: WT-Entnahmen via linked_items einrechnen
                bestand += wtLinkedDeduction(itemId);
                return { bestand, fillDate: rows[0].timestamp };
            }
            function vorratHasAnyEntries(itemId) {
                return entriesForItem(itemId).some((e) =>
                    ["auffuellung", "entnahme", "delta"].includes(e.entry_type),
                );
            }
            function vorratTodayUsed(itemId) {
                const td = todayKey();
                const manualUsed = _allEntries
                    .filter((e) => e.item_id === itemId && e.date === td)
                    .reduce((s, e) => {
                        const amt = parseFloat(e.amount) || 0;
                        if (e.entry_type === "entnahme") return s + amt;
                        if (e.entry_type === "delta" && amt < 0)
                            return s + Math.abs(amt);
                        return s;
                    }, 0);
                // Add WT-linked deductions for today only
                const wtToday = _wtByDate[td] || { spicy: 0, blend: 0 };
                const wtTodayDeduction = wtLinkedDeductionForDay(
                    itemId,
                    wtToday.spicy || 0,
                    wtToday.blend || 0,
                );
                return (
                    manualUsed +
                    (wtTodayDeduction < 0 ? Math.abs(wtTodayDeduction) : 0)
                );
            }

            // Calculates total WT-driven deduction for an item across all days.
            // Looks at all items that have this item in their linked_items,
            // then sums up WT counts (spicy/blend) × the linked amount.
            function wtLinkedDeduction(itemId) {
                const item = itemById(itemId);
                if (!item) return 0;
                let total = 0;
                // For each day in _wtByDate, check if any WT-tracked item links to this item
                Object.values(_wtByDate).forEach((dayWt) => {
                    total += wtLinkedDeductionForDay(
                        itemId,
                        dayWt.spicy || 0,
                        dayWt.blend || 0,
                    );
                });
                return total;
            }

            // For a single day's WT counts, calculate the deduction for itemId via linked_items.
            function wtLinkedDeductionForDay(itemId, spicy, blend) {
                let deduction = 0;
                allItems().forEach((sourceItem) => {
                    if (
                        !sourceItem.linked_items ||
                        !sourceItem.linked_items.length
                    )
                        return;
                    // How many WT events for this source item today?
                    let wtCount = 0;
                    if (sourceItem.slug === "spicy") wtCount = spicy;
                    if (sourceItem.slug === "zigarette") wtCount = blend;
                    if (wtCount === 0) return;
                    // Does this source item link to our target item?
                    sourceItem.linked_items.forEach((link) => {
                        const linkedItem = allItems().find(
                            (i) =>
                                i.slug === link.item_slug ||
                                i.id === link.item_slug,
                        );
                        if (linkedItem && linkedItem.id === itemId) {
                            deduction +=
                                wtCount * (parseFloat(link.amount) || 0);
                        }
                    });
                });
                return deduction; // negative = Entnahme
            }

            // ── Packungshierarchie ──
            // Gibt "28 Stk. (≈ 0.2 Pkg.)" zurück wenn pack_size definiert
            function fmtAmtWithPack(amount, item) {
                const base = fmtAmt(amount, item);
                if (!item.pack_size || !item.pack_unit) return base;
                const packs = amount / parseFloat(item.pack_size);
                const packStr =
                    packs >= 1
                        ? `${+packs.toFixed(1).replace(/\.0$/, "")} ${item.pack_unit}`
                        : `≈ ${+packs.toFixed(2).replace(/\.?0+$/, "")} ${item.pack_unit}`;
                return `${base} <span style="color:var(--muted);font-size:10px">(${packStr})</span>`;
            }

            // Tages-Gesamtmenge für Zähler (netto, Richtung beachten)
            function zaehlerTodayNet(itemId) {
                const td = todayKey();
                return _allEntries
                    .filter(
                        (e) =>
                            e.item_id === itemId &&
                            e.date === td &&
                            e.entry_type === "zaehler",
                    )
                    .reduce((s, e) => s + (parseFloat(e.amount) || 0), 0);
            }

            function catColorClass(color) {
                return (
                    {
                        green: "cat-kiffen",
                        orange: "cat-rauchen",
                        blue: "cat-lebensmittel",
                    }[color] || ""
                );
            }

            /* ════════════════════════════════════════════════════════════════
   LOAD
   ════════════════════════════════════════════════════════════════ */
            async function loadAll() {
                setApiStatus("loading");
                try {
                    const [catData, trackingData, shiftsData] =
                        await Promise.all([
                            apiFetch("/api/tracking/categories"),
                            apiFetch("/api/tracking/entries?limit=500"),
                            apiFetch("/api/shifts?limit=100"),
                        ]);
                    _categories = catData.categories || [];
                    _allEntries = trackingData.entries || [];

                    const shifts = shiftsData.shifts || shiftsData || [];
                    const newWt = {};
                    await Promise.all(
                        shifts.map(async (s) => {
                            try {
                                const detail = await apiFetch(
                                    `/api/shift/${s.id}`,
                                );
                                const breaks = detail.breaks || [];
                                const sSpicy = breaks.reduce(
                                    (a, b) => a + (b.zig_spicy || 0),
                                    0,
                                );
                                const sBlend = breaks.reduce(
                                    (a, b) => a + (b.zig_blend || 0),
                                    0,
                                );
                                if (!sSpicy && !sBlend) return;
                                const dk = new Date(
                                    s.work_start,
                                ).toLocaleDateString("en-CA", {
                                    timeZone: "Europe/Vienna",
                                });
                                if (!newWt[dk])
                                    newWt[dk] = {
                                        spicy: 0,
                                        blend: 0,
                                        shifts: [],
                                    };
                                newWt[dk].spicy += sSpicy;
                                newWt[dk].blend += sBlend;
                                newWt[dk].shifts.push({
                                    station: s.station,
                                    spicy: sSpicy,
                                    blend: sBlend,
                                });
                            } catch (_) {}
                        }),
                    );
                    _wtByDate = newWt;
                    _activeDay = null;
                    _apiOnline = true;
                    setApiStatus("ok");
                    renderToday();
                    if (
                        document
                            .getElementById("tab-verlauf")
                            .classList.contains("visible")
                    )
                        renderVerlauf();
                    if (
                        document
                            .getElementById("tab-einstellungen")
                            .classList.contains("visible")
                    )
                        renderEinstellungen();
                } catch (e) {
                    _apiOnline = false;
                    setApiStatus("err", e.message);
                    renderToday();
                }
            }

            function setApiStatus(state, msg) {
                const dot = document.getElementById("apiDot");
                const txt = document.getElementById("apiStatusText");
                const nd = document.getElementById("statusDot");
                const nt = document.getElementById("statusText");
                const total = _allEntries.filter(
                    (e) => e.date === todayKey(),
                ).length;
                if (state === "ok") {
                    dot.className = "dot-sm ok";
                    txt.textContent = `API verbunden · ${_allEntries.length} Einträge`;
                    nd.style.background = "var(--green)";
                    nd.style.animation = "pulse 2s ease-in-out infinite";
                    nt.textContent = total + " heute";
                } else if (state === "err") {
                    dot.className = "dot-sm err";
                    txt.textContent =
                        "API nicht erreichbar" + (msg ? ` · ${msg}` : "");
                    nd.style.background = "var(--accent-red)";
                    nd.style.animation = "none";
                    nt.textContent = "offline";
                } else {
                    dot.className = "dot-sm";
                    txt.textContent = "Verbinde…";
                    nd.style.background = "var(--muted)";
                    nd.style.animation = "none";
                    nt.textContent = "laden…";
                }
            }

            /* ════════════════════════════════════════════════════════════════
   RENDER — Heute (dynamic from _categories)
   ════════════════════════════════════════════════════════════════ */
            function renderToday() {
                const container = document.getElementById("heute-content");
                if (!_categories.length) {
                    container.innerHTML =
                        '<div class="empty-state">Keine Items konfiguriert.<br>Füge Items unter ⚙ Einstellungen hinzu.</div>';
                    return;
                }
                container.innerHTML = "";
                const wtToday = _wtByDate[todayKey()] || {
                    spicy: 0,
                    blend: 0,
                    shifts: [],
                };

                _categories.forEach((cat) => {
                    const items = cat.items || [];
                    if (!items.length) return;
                    const colorClass = catColorClass(cat.color);
                    let catActivity = 0;
                    let itemsHtml = "";

                    items.forEach((item) => {
                        const dir = item.counter_direction || "+";
                        const isNeg = dir === "-";

                        if (item.tracking_mode === "bestand") {
                            // Legacy bestand — render as simple vorrat without counter
                            const vd =
                                vorratBestand(item.id) ||
                                (() => {
                                    // fall back to old bestand entries
                                    const rows = entriesForItem(item.id)
                                        .filter(
                                            (e) => e.entry_type === "bestand",
                                        )
                                        .sort((a, b) =>
                                            b.timestamp.localeCompare(
                                                a.timestamp,
                                            ),
                                        );
                                    if (!rows.length) return null;
                                    return {
                                        bestand: parseFloat(rows[0].amount),
                                        filled: parseFloat(rows[0].amount),
                                        used: 0,
                                        fillDate: rows[0].timestamp,
                                    };
                                })();
                            if (vd) catActivity++;
                            const dispHtml = vd
                                ? `<div class="item-bestand"><span class="bestand-val">${fmtAmtWithPack(vd.bestand, item)}</span><span class="bestand-label">Bestand · ${localDateStr(vd.fillDate)}</span></div>`
                                : `<div class="item-bestand"><span class="bestand-label">Kein Bestand eingetragen</span></div>`;
                            itemsHtml += `<div class="item-card">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-meta">Vorrat · ${item.base_unit}</div>
                                    ${dispHtml}
                                </div>
                                <div class="item-actions">
                                    <button class="btn-unit" onclick="openEntry('${item.id}')">Eintrag</button>
                                </div>
                            </div>`;
                        } else if (item.tracking_mode === "vorrat") {
                            const vd = vorratBestand(item.id);
                            const todayUsed = vorratTodayUsed(item.id);
                            if (vd) catActivity++;
                            // Warn colors
                            const bestandColor =
                                vd && vd.bestand <= 0
                                    ? "var(--accent-red)"
                                    : vd &&
                                        vd.filled > 0 &&
                                        vd.bestand <= vd.filled * 0.2
                                      ? "var(--orange)"
                                      : "var(--text)";
                            const dispHtml = vd
                                ? `<div class="item-bestand">
                                    <span class="bestand-val" style="color:${bestandColor}">${fmtAmtWithPack(vd.bestand, item)}</span>
                                    <span class="bestand-label">übrig · ${localDateStr(vd.fillDate)}</span>
                                    ${todayUsed > 0 ? `<span style="color:rgba(255,255,255,.15);font-size:9px">·</span><span class="bestand-verbrauch" style="color:var(--accent-red)">−${fmtAmt(todayUsed, item)} heute</span>` : ""}
                                  </div>`
                                : (() => {
                                      const hasEntries = vorratHasAnyEntries(
                                          item.id,
                                      );
                                      return hasEntries
                                          ? `<div class="item-bestand"><span class="bestand-label" style="color:var(--orange)">⚠ Erst Anfangsbestand auffüllen (✎ Button)</span></div>`
                                          : `<div class="item-bestand"><span class="bestand-label">Kein Vorrat eingetragen</span></div>`;
                                  })();
                            itemsHtml += `<div class="item-card">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-meta">Vorrat · ${item.base_unit}</div>
                                    ${dispHtml}
                                </div>
                                <div class="item-actions">
                                    ${renderItemButtons(item)}
                                    <button class="btn-icon" onclick="openEntry('${item.id}')" title="Auffüllen / Entnahme">
                                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.5 1.5l3 3-9 9H2.5v-3l9-9z"/></svg>
                                    </button>
                                </div>
                            </div>`;
                        } else {
                            // Zähler
                            const total = zaehlerTodayNet(item.id);
                            if (total > 0) catActivity++;

                            // WT supplement
                            let wtHtml = "";
                            const wtSpicy =
                                item.slug === "spicy" ? wtToday.spicy : 0;
                            const wtBlend =
                                item.slug === "zigarette" ? wtToday.blend : 0;
                            const wtAmt = wtSpicy + wtBlend;
                            if (wtAmt > 0) {
                                catActivity++;
                                const src =
                                    wtToday.shifts
                                        .map((s) => s.station)
                                        .join(", ") || "Dienst";
                                wtHtml = `<div class="item-wt-row">
                                    <span class="wt-arbeit-badge">Arbeit</span>
                                    <span class="wt-arbeit-val">+${wtAmt} im Dienst</span>
                                    <span class="wt-arbeit-src">${src}</span>
                                </div>`;
                            }
                            const totalIncWT = total + wtAmt;

                            // Counter button: shows direction + unit_size
                            const stdVal = parseFloat(item.unit_size) || 1;
                            const cntLabel =
                                item.slug === "redbull"
                                    ? `${isNeg ? "−" : "+"}1 Dose`
                                    : `${isNeg ? "−" : "+"}${fmtAmt(stdVal, item)}`;
                            const cntColor = isNeg
                                ? "rgba(255,0,81,.4)"
                                : "rgba(255,255,255,.25)";
                            const cntTextColor = isNeg
                                ? "var(--accent-red)"
                                : "var(--text)";

                            // Display: show net total with direction
                            let dispText = "—";
                            if (total > 0) {
                                dispText = fmtAmt(total, item);
                                if (item.pack_size && item.pack_unit) {
                                    const packs =
                                        total / parseFloat(item.pack_size);
                                    dispText += ` <span style="color:var(--muted);font-size:10px">(${+packs.toFixed(2).replace(/\.?0+$/, "")} ${item.pack_unit})</span>`;
                                }
                            }

                            itemsHtml += `<div class="item-card">
                                <div>
                                    <div class="item-name">${item.name}</div>
                                    <div class="item-meta">Zähler · ${isNeg ? "abzählend" : "aufzählend"} · ${item.base_unit}</div>
                                    <div class="item-zaehler">Heute: <span>${dispText}</span>${totalIncWT > total ? ` · Gesamt: <span>${fmtAmt(totalIncWT, item)}</span>` : ""}</div>
                                    ${wtHtml}
                                </div>
                                <div class="item-actions">
                                    ${renderItemButtons(item)}
                                    <button class="btn-icon" onclick="openEntry('${item.id}')" title="Manuell / mit Notiz">
                                        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.5 1.5l3 3-9 9H2.5v-3l9-9z"/></svg>
                                    </button>
                                </div>
                            </div>`;
                        }
                    });

                    container.innerHTML += `
                        <div class="cat-group ${colorClass}">
                            <div class="cat-header">
                                <span class="cat-icon">${cat.emoji}</span>
                                <span class="cat-title">${cat.name}</span>
                                <span class="cat-today-total">${catActivity > 0 ? catActivity + " aktiv" : ""}</span>
                            </div>
                            ${itemsHtml}
                        </div>`;
                });
            }

            /* ════════════════════════════════════════════════════════════════
   RENDER — Verlauf
   ════════════════════════════════════════════════════════════════ */
            function renderVerlauf() {
                const container = document.getElementById("verlauf-content");
                const filterBar = document.getElementById("date-filter");

                if (!_allEntries.length && !Object.keys(_wtByDate).length) {
                    container.innerHTML =
                        '<div class="empty-state">Noch keine Einträge.</div>';
                    filterBar.innerHTML = "";
                    return;
                }

                const byDate = {};
                _allEntries.forEach((e) => {
                    if (!byDate[e.date]) byDate[e.date] = [];
                    byDate[e.date].push(e);
                });

                const td = todayKey();
                const yd = (() => {
                    const x = new Date();
                    x.setDate(x.getDate() - 1);
                    return x.toLocaleDateString("en-CA", {
                        timeZone: "Europe/Vienna",
                    });
                })();
                const dayNames = ["So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"];

                const allDates = [
                    ...new Set([
                        ...Object.keys(byDate),
                        ...Object.keys(_wtByDate),
                    ]),
                ]
                    .sort((a, b) => b.localeCompare(a))
                    .slice(0, 30);

                function dateLabelFor(date) {
                    if (date === td) return "Heute";
                    if (date === yd) return "Gestern";
                    const [y, m, d] = date.split("-");
                    return `${dayNames[new Date(+y, +m - 1, +d).getDay()]} ${d}.${m}.`;
                }

                // Filter pills
                filterBar.innerHTML = "";
                const allBtn = document.createElement("button");
                allBtn.className =
                    "date-filter-btn" + (_activeDay === null ? " active" : "");
                allBtn.textContent = "Alle";
                allBtn.onclick = () => {
                    _activeDay = null;
                    renderVerlauf();
                };
                filterBar.appendChild(allBtn);
                allDates.forEach((date) => {
                    const btn = document.createElement("button");
                    btn.className =
                        "date-filter-btn" +
                        (_activeDay === date ? " active" : "");
                    btn.textContent = dateLabelFor(date);
                    btn.onclick = () => {
                        _activeDay = date;
                        renderVerlauf();
                    };
                    filterBar.appendChild(btn);
                });

                const datesToRender = _activeDay ? [_activeDay] : allDates;
                container.innerHTML = "";

                datesToRender.forEach((date) => {
                    const entries = (byDate[date] || []).sort((a, b) =>
                        b.timestamp.localeCompare(a.timestamp),
                    );
                    const wtDay = _wtByDate[date] || {
                        spicy: 0,
                        blend: 0,
                        shifts: [],
                    };

                    const zaehlerTotals = {};
                    entries
                        .filter((e) => e.entry_type === "zaehler")
                        .forEach((e) => {
                            zaehlerTotals[e.item_id] =
                                (zaehlerTotals[e.item_id] || 0) + e.amount;
                        });
                    if (wtDay.spicy > 0) {
                        const spicyItem = allItems().find(
                            (i) => i.slug === "spicy",
                        );
                        if (spicyItem)
                            zaehlerTotals[spicyItem.id] =
                                (zaehlerTotals[spicyItem.id] || 0) +
                                wtDay.spicy;
                    }
                    if (wtDay.blend > 0) {
                        const zigItem = allItems().find(
                            (i) => i.slug === "zigarette",
                        );
                        if (zigItem)
                            zaehlerTotals[zigItem.id] =
                                (zaehlerTotals[zigItem.id] || 0) + wtDay.blend;
                    }

                    const totalBadges = Object.entries(zaehlerTotals)
                        .map(([id, amt]) => {
                            const item = itemById(id);
                            return `<span class="history-total-badge">${item ? item.name : "?"}: ${fmtAmt(amt, item)}</span>`;
                        })
                        .join("");

                    const entryRows = entries
                        .map((e) => {
                            const item = itemById(e.item_id);
                            let typeLabel;
                            const eAmt = parseFloat(e.amount) || 0;
                            if (e.entry_type === "bestand") {
                                typeLabel = `<span class="history-type-badge bestand">Bestand</span>`;
                            } else if (e.entry_type === "auffuellung") {
                                typeLabel = `<span class="history-type-badge auffuellung">+${fmtAmt(eAmt, item)}</span>`;
                            } else if (e.entry_type === "entnahme") {
                                typeLabel = `<span class="history-type-badge entnahme">−${fmtAmt(eAmt, item)}</span>`;
                            } else if (e.entry_type === "delta") {
                                typeLabel =
                                    eAmt >= 0
                                        ? `<span class="history-type-badge auffuellung">+${fmtAmt(eAmt, item)}</span>`
                                        : `<span class="history-type-badge entnahme">−${fmtAmt(Math.abs(eAmt), item)}</span>`;
                            } else {
                                typeLabel = `<span class="history-type-badge zaehler">+${fmtAmt(eAmt, item)}</span>`;
                            }
                            return `<div class="history-entry">
                            <span class="history-time">${localTimeStr(e.timestamp)}</span>
                            <span class="history-name">${e.name}</span>
                            ${typeLabel}
                            <span class="history-amount">${e.note ? `<span style="color:var(--muted)">${e.note}</span>` : ""}</span>
                            <button class="history-delete" onclick="deleteEntry('${e.id}')" title="Löschen">×</button>
                        </div>`;
                        })
                        .join("");

                    let wtRows = "";
                    if (wtDay.spicy > 0) {
                        const src =
                            wtDay.shifts.map((s) => s.station).join(", ") ||
                            "Dienst";
                        wtRows += `<div class="history-entry" style="opacity:.7">
                            <span class="history-time" style="color:var(--accent-blue)">WT</span>
                            <span class="history-name">Spicy</span>
                            <span class="history-type-badge" style="background:rgba(0,166,237,.1);border:1px solid rgba(0,166,237,.25);color:var(--accent-blue)">Arbeit</span>
                            <span class="history-amount"><span>${wtDay.spicy} Stk.</span> · ${src}</span>
                            <span style="width:24px;flex-shrink:0"></span>
                        </div>`;
                    }
                    if (wtDay.blend > 0) {
                        const src =
                            wtDay.shifts.map((s) => s.station).join(", ") ||
                            "Dienst";
                        wtRows += `<div class="history-entry" style="opacity:.7">
                            <span class="history-time" style="color:var(--accent-blue)">WT</span>
                            <span class="history-name">Zigarette</span>
                            <span class="history-type-badge" style="background:rgba(0,166,237,.1);border:1px solid rgba(0,166,237,.25);color:var(--accent-blue)">Arbeit</span>
                            <span class="history-amount"><span>${wtDay.blend} Stk.</span> · ${src}</span>
                            <span style="width:24px;flex-shrink:0"></span>
                        </div>`;
                    }

                    const totalEntries =
                        entries.length +
                        (wtDay.spicy > 0 ? 1 : 0) +
                        (wtDay.blend > 0 ? 1 : 0);
                    container.innerHTML += `<div class="history-day">
                        <div class="day-header">
                            <span class="day-label">${dateLabelFor(date)}</span>
                            <span class="day-count">${totalEntries} Eintr.</span>
                            <div class="day-line"></div>
                            ${totalBadges ? `<div style="display:flex;gap:.35rem;flex-wrap:wrap">${totalBadges}</div>` : ""}
                        </div>
                        ${entryRows}${wtRows}
                    </div>`;
                });
            }

            /* ════════════════════════════════════════════════════════════════
   RENDER — Einstellungen
   ════════════════════════════════════════════════════════════════ */
            function renderEinstellungen() {
                const container = document.getElementById(
                    "einstellungen-content",
                );
                container.innerHTML = `
                    <div class="settings-section">
                        <div class="settings-section-header">
                            <span class="settings-section-title">Kategorien & Items</span>
                            <button class="btn-add" onclick="openCatSheet(null)">+ Kategorie</button>
                        </div>
                        ${_categories.map((cat) => renderSettingsCat(cat)).join("")}
                        ${!_categories.length ? '<div class="empty-state">Noch keine Kategorien.</div>' : ""}
                    </div>`;
            }

            function renderSettingsCat(cat) {
                const items = cat.items || [];
                const itemRows = items
                    .map(
                        (item) => `
                    <div class="settings-item-row">
                        <div>
                            <div class="settings-item-name">${item.name}</div>
                            <div class="settings-item-meta">${item.counter_direction === "-" ? "−" : "+"} ${item.unit_size} ${item.base_unit}${item.pack_size ? ` · 1 ${item.pack_unit || "Pkg."} = ${item.pack_size} ${item.base_unit}` : ""}${item.buttons && item.buttons.length ? ` · ${item.buttons.length} Btn` : ""}</div>
                            ${item.linked_items && item.linked_items.length ? `<div style="font-family:'DM Mono',monospace;font-size:9px;color:var(--accent-blue);margin-top:2px">→ ${item.linked_items.map((l) => l.item_slug + (l.amount < 0 ? " " + l.amount : "")).join(", ")}</div>` : ""}
                        </div>
                        <span class="settings-item-mode ${item.tracking_mode}">${
                            item.tracking_mode === "bestand"
                                ? "Bestand"
                                : item.tracking_mode === "vorrat"
                                  ? "Vorrat"
                                  : "Zähler"
                        }</span>
                        <button class="btn-edit-item" onclick="openItemSheet('${item.id}','${cat.id}')" title="Bearbeiten">
                            <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.5 1.5l3 3-9 9H2.5v-3l9-9z"/></svg>
                        </button>
                    </div>`,
                    )
                    .join("");

                return `<div class="settings-cat" id="scat-${cat.id}">
                    <div class="settings-cat-header" onclick="toggleCat('${cat.id}')">
                        <span class="settings-cat-emoji">${cat.emoji}</span>
                        <span class="settings-cat-name">${cat.name}</span>
                        <span class="settings-cat-count">${items.length} Items</span>
                        <span class="settings-cat-chevron" id="chevron-${cat.id}">▼</span>
                    </div>
                    <div class="settings-cat-body" id="catbody-${cat.id}">
                        <div class="settings-cat-actions">
                            <button class="btn-add" onclick="openItemSheet(null,'${cat.id}')">+ Item</button>
                            <button class="btn-edit-item" onclick="openCatSheet('${cat.id}')" title="Kategorie bearbeiten" style="margin-left:auto">
                                <svg width="11" height="11" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M11.5 1.5l3 3-9 9H2.5v-3l9-9z"/></svg>
                            </button>
                        </div>
                        ${itemRows || "<div style=\"font-family:'DM Mono',monospace;font-size:11px;color:var(--muted);padding:.75rem 1.1rem\">Keine Items.</div>"}
                    </div>
                </div>`;
            }

            function toggleCat(catId) {
                const body = document.getElementById(`catbody-${catId}`);
                const chevron = document.getElementById(`chevron-${catId}`);
                const open = body.classList.toggle("open");
                chevron.classList.toggle("open", open);
            }

            /* ════════════════════════════════════════════════════════════════
   CATEGORY SHEET
   ════════════════════════════════════════════════════════════════ */
            function openCatSheet(catId) {
                const cat = catId
                    ? _categories.find((c) => c.id === catId)
                    : null;
                const title = cat ? "Kategorie bearbeiten" : "Neue Kategorie";

                const EMOJIS = [
                    "🌿",
                    "🚬",
                    "☕",
                    "🍺",
                    "💊",
                    "🏃",
                    "🎮",
                    "📚",
                    "💤",
                    "🎵",
                    "🍕",
                    "🧴",
                ];
                const COLORS = [
                    { val: "green", label: "Grün" },
                    { val: "orange", label: "Orange" },
                    { val: "blue", label: "Blau" },
                    { val: "muted", label: "Grau" },
                ];

                showSheet(`
                    <div class="sheet-label">Kategorie</div>
                    <div class="sheet-title">${title}</div>
                    <div class="sheet-row">
                        <div class="sheet-label" style="margin-bottom:4px">Name</div>
                        <input class="sheet-input" id="cs-name" type="text" value="${cat ? cat.name : ""}" placeholder="z.B. Getränke">
                    </div>
                    <div class="sheet-row">
                        <div class="sheet-label" style="margin-bottom:6px">Emoji</div>
                        <div style="display:flex;flex-wrap:wrap;gap:.4rem" id="cs-emojis">
                            ${EMOJIS.map(
                                (
                                    e,
                                ) => `<button onclick="selectEmoji(this,'${e}')" data-val="${e}"
                                style="width:36px;height:36px;border-radius:8px;border:1px solid ${cat && cat.emoji === e ? "var(--accent-blue)" : "var(--border)"};background:${cat && cat.emoji === e ? "rgba(0,166,251,.08)" : "none"};font-size:16px;cursor:pointer;transition:all .15s">${e}</button>`,
                            ).join("")}
                        </div>
                        <input type="hidden" id="cs-emoji" value="${cat ? cat.emoji : "📦"}">
                    </div>
                    <div class="sheet-row">
                        <div class="sheet-label" style="margin-bottom:6px">Farbe</div>
                        <div class="sheet-toggle" id="cs-colors">
                            ${COLORS.map((c) => `<button class="sheet-toggle-btn ${cat && cat.color === c.val ? "active" : ""}" onclick="selectColor(this,'${c.val}')" data-val="${c.val}">${c.label}</button>`).join("")}
                        </div>
                        <input type="hidden" id="cs-color" value="${cat ? cat.color : "muted"}">
                    </div>
                    <div class="sheet-btns" style="margin-top:1rem">
                        <button class="btn-save" onclick="saveCat('${catId || ""}')">Speichern</button>
                        <button class="btn-cancel" onclick="closeSheet()">Abbrechen</button>
                        ${cat ? `<button class="btn-danger" onclick="deleteCat('${catId}')">Löschen</button>` : ""}
                    </div>
                    <div id="sheet-msg" style="font-family:'DM Mono',monospace;font-size:11px;margin-top:.5rem;text-align:center"></div>
                `);
            }

            function selectEmoji(btn, val) {
                document.querySelectorAll("#cs-emojis button").forEach((b) => {
                    const active = b.dataset.val === val;
                    b.style.borderColor = active
                        ? "var(--accent-blue)"
                        : "var(--border)";
                    b.style.background = active
                        ? "rgba(0,166,251,.08)"
                        : "none";
                });
                document.getElementById("cs-emoji").value = val;
            }
            function selectColor(btn, val) {
                document
                    .querySelectorAll("#cs-colors button")
                    .forEach((b) =>
                        b.classList.toggle("active", b.dataset.val === val),
                    );
                document.getElementById("cs-color").value = val;
            }

            async function saveCat(catId) {
                const name = document.getElementById("cs-name").value.trim();
                const emoji = document.getElementById("cs-emoji").value;
                const color = document.getElementById("cs-color").value;
                const msg = document.getElementById("sheet-msg");
                if (!name) {
                    msg.style.color = "var(--accent-red)";
                    msg.textContent = "Name fehlt";
                    return;
                }
                msg.style.color = "var(--muted)";
                msg.textContent = "Speichere…";
                try {
                    if (catId) {
                        await apiFetch(
                            `/api/tracking/categories/${catId}`,
                            "PATCH",
                            { name, emoji, color },
                        );
                    } else {
                        await apiFetch("/api/tracking/categories", "POST", {
                            name,
                            emoji,
                            color,
                        });
                    }
                    closeSheet();
                    await loadAll();
                    renderEinstellungen();
                } catch (e) {
                    msg.style.color = "var(--accent-red)";
                    msg.textContent = e.message;
                }
            }

            async function deleteCat(catId) {
                if (!confirm("Kategorie löschen?")) return;
                try {
                    await apiFetch(
                        `/api/tracking/categories/${catId}`,
                        "DELETE",
                    );
                    closeSheet();
                    await loadAll();
                    renderEinstellungen();
                } catch (e) {
                    alert("Fehler: " + e.message);
                }
            }

            /* ════════════════════════════════════════════════════════════════
   ITEM SHEET
   ════════════════════════════════════════════════════════════════ */
            function openItemSheet(itemId, catId) {
                const item = itemId
                    ? allItems().find((i) => i.id === itemId)
                    : null;
                const title = item ? "Item bearbeiten" : "Neues Item";
                const UNITS = [
                    "Stk.",
                    "g",
                    "ml",
                    "Dose",
                    "kg",
                    "l",
                    "Packung",
                    "Tablette",
                    "Kapsel",
                ];
                const mode = item ? item.tracking_mode : "zaehler";
                const dir = item ? item.counter_direction || "+" : "+";

                showSheet(`
                    <div class="sheet-label">Item</div>
                    <div class="sheet-title">${title}</div>

                    <div class="sheet-row">
                        <div class="sheet-label" style="margin-bottom:4px">Name</div>
                        <input class="sheet-input" id="is-name" type="text" value="${item ? item.name : ""}" placeholder="z.B. Bupropion 150mg">
                    </div>

                    <div class="sheet-row">
                        <div class="sheet-label" style="margin-bottom:4px">Slug
                            <span style="font-weight:400;color:var(--muted)"> · für Verknüpfte Buchungen</span>
                        </div>
                        ${
                            item
                                ? `<div style="display:flex;align-items:center;gap:.5rem">
                                <code style="font-family:'DM Mono',monospace;font-size:12px;color:var(--accent-blue);background:rgba(0,166,251,.08);border:1px solid rgba(0,166,251,.2);border-radius:6px;padding:6px 10px;flex:1;word-break:break-all">${item.slug || "—"}</code>
                                <button onclick="navigator.clipboard.writeText('${item.slug || ""}').then(()=>showToast('Slug kopiert'))"
                                    style="background:none;border:1px solid var(--border);border-radius:6px;padding:6px 10px;color:var(--muted);font-size:11px;cursor:pointer;white-space:nowrap">Copy</button>
                               </div>`
                                : `<input class="sheet-input" id="is-slug" type="text" placeholder="auto (aus Name generiert)" style="font-family:'DM Mono',monospace;font-size:12px">
                               <div style="font-family:'DM Mono',monospace;font-size:10px;color:var(--muted);margin-top:.3rem">Nur a-z, 0-9 und - · kann nach Erstellen nicht mehr geändert werden</div>`
                        }
                    </div>

                    <div class="sheet-row">
                        <div class="sheet-label" style="margin-bottom:6px">Tracking-Modus</div>

                            <button class="sheet-toggle-btn ${mode === "zaehler" ? "active" : ""}"

                                onclick="selectMode(this,'vorrat')" data-val="vorrat">Vorrat</button>
